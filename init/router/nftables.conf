flush ruleset

define IF_UPLINK = "uplink"
define IF_INET   = "int"
define IF_DMZ    = "dmz"
define IF_CORP   = "corp"

define NET_INET  = 10.67.0.0/24
define NET_DMZ   = 10.69.0.0/24
define NET_CORP  = 10.70.0.0/24
define JUICE     = 10.69.0.11


table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop
        iifname $IF_CORP ip saddr $NET_CORP accept      
        icmp type echo-request limit rate 10/second accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iifname $IF_CORP ip saddr $NET_CORP oifname { $IF_DMZ, $IF_INET, $IF_UPLINK } accept
        iifname $IF_INET ip saddr != { $NET_DMZ, $NET_CORP } oifname $IF_DMZ ip daddr $JUICE tcp dport 3000 accept
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname { $IF_INET, $IF_UPLINK } ip saddr $NET_CORP masquerade
    }
}
